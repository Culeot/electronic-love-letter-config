<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>七夕 · 只为你</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;700&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF1EF;--pink-1:#F8DDE2;--pink-2:#F3C6CD;--pink-3:#E39AA6;
  --rose:#B85C6E;--wine:#6F2E3A;--gold:#D7B98E;--gold-deep:#C9A26B;
  --ink:#2C1D22;--cream:#FFF9F6;
  --ease-soft:cubic-bezier(0.16,1,0.3,1);
  --ease-bounce:cubic-bezier(0.34,1.56,0.64,1);
  --space-sm:clamp(1.5rem,3vw,3rem);
  --space-md:clamp(3rem,8vw,7rem);
  --space-lg:clamp(6rem,15vw,14rem);
  --space-xl:clamp(10rem,22vw,20rem);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Cormorant Garamond","Noto Serif SC",serif;
  background:var(--bg);color:var(--wine);
  overflow-x:hidden;min-height:100dvh;line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
@supports (hover:hover) and (pointer:fine){
  body{cursor:none}
}
::selection{background:var(--pink-2);color:var(--wine)}

/* ===== 噪点层 ===== */
.grain{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.04;mix-blend-mode:overlay}

/* ===== 自定义光标 ===== */
.cursor{
  position:fixed;width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle,rgba(215,185,142,0.7),transparent 70%);
  pointer-events:none;z-index:9998;transform:translate(-50%,-50%);
  transition:transform 0.15s var(--ease-soft),opacity 0.3s;
  mix-blend-mode:multiply;
}
.cursor.click{transform:translate(-50%,-50%) scale(2.5);opacity:0.3}
@media (hover:none),(pointer:coarse){.cursor{display:none}body{cursor:auto}}

/* ===== 花瓣粒子 Canvas ===== */
#petalCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ===== 呼吸光晕 ===== */
.halo{position:fixed;border-radius:50%;pointer-events:none;z-index:0;animation:breathe 8s ease-in-out infinite alternate}
.halo-1{width:60vw;height:60vw;top:-10%;right:-15%;background:radial-gradient(circle,rgba(248,221,226,0.5),transparent 65%)}
.halo-2{width:45vw;height:45vw;bottom:-10%;left:-10%;background:radial-gradient(circle,rgba(243,198,205,0.4),transparent 60%);animation-delay:-4s}
@keyframes breathe{from{transform:scale(0.9);opacity:0.4}to{transform:scale(1.2);opacity:0.8}}

/* ===== SVG 流体形状 ===== */
.organic-blob{position:fixed;filter:url(#liquid);z-index:0;pointer-events:none;animation:flow 16s ease-in-out infinite alternate}
.organic-blob-1{width:38vw;height:38vw;top:25vh;right:-5vw;background:var(--pink-2);opacity:0.3;transform:rotate(-8deg)}
.organic-blob-2{width:28vw;height:28vw;bottom:15vh;left:-8vw;background:var(--pink-1);opacity:0.25;animation-delay:-8s;animation-duration:20s}
@keyframes flow{from{transform:translateX(-3%) rotate(-2deg) scale(1)}to{transform:translateX(3%) rotate(2deg) scale(1.05)}}

/* ===== 场景锁定系统 ===== */
.scene{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:10vh 8vw;opacity:0;transition:opacity 1s var(--ease-soft),transform 1s var(--ease-soft);
  pointer-events:none;position:absolute;top:0;left:0;width:100%;z-index:1;transform:translateY(30px);
}
.scene.active{opacity:1;pointer-events:auto;position:relative;z-index:2;transform:translateY(0)}

/* ===== 加载幕 ===== */
#loading{
  position:fixed;inset:0;z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity 0.8s var(--ease-soft);
}
#loading.hide{opacity:0;pointer-events:none}
#loading p{
  font-family:"Ma Shan Zheng","Zhi Mang Xing",cursive;
  font-size:clamp(20px,4vw,32px);color:var(--rose);
  margin-bottom:2rem;letter-spacing:0.05em;
}
.progress-line{width:min(280px,60vw);height:2px;background:var(--pink-1);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:2px;transition:width 0.1s linear}

/* ===== 封面 ===== */
#act-1{padding:0}
.cover-wrap{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:auto auto auto;
  align-items:center;min-height:100dvh;width:100%;padding:0 8vw;
}
.cover-title{
  grid-column:1/6;grid-row:1/2;
  font-family:"Playfair Display","Noto Serif SC",serif;
  font-size:clamp(52px,12vw,150px);font-weight:700;
  letter-spacing:0.02em;color:var(--wine);line-height:1.1;
}
.cover-sub{
  grid-column:5/9;grid-row:2/3;justify-self:end;align-self:start;
  font-family:"Ma Shan Zheng","Zhi Mang Xing",cursive;
  font-size:clamp(24px,5vw,56px);color:var(--rose);margin-top:4vh;
}
.cover-btn-wrap{grid-column:1/5;grid-row:3/4;margin-top:6vh}
#poemBtnWrap{grid-column:3/7;margin-top:var(--space-md);opacity:0;pointer-events:none;transition:opacity 0.8s var(--ease-soft)}
#poemBtnWrap.show{opacity:1;pointer-events:auto}

/* ===== 按钮 ===== */
.btn-love{
  position:relative;display:inline-flex;align-items:center;gap:0.75rem;
  padding:0.9rem 2.4rem;border:none;background:transparent;
  font-family:"Noto Serif SC",serif;font-size:clamp(16px,2.5vw,20px);
  color:var(--wine);cursor:pointer;letter-spacing:0.08em;
  transition:all 0.3s var(--ease-soft);touch-action:manipulation;
}
.btn-love .btn-underline{
  position:absolute;bottom:0;left:50%;width:0;height:2px;
  background:var(--gold);transition:width 0.6s var(--ease-soft),left 0.6s var(--ease-soft);
}
.btn-love:hover .btn-underline,.btn-love:active .btn-underline,.btn-love:focus .btn-underline{width:85%;left:7.5%}
.btn-love:active{transform:scale(0.97)}
@media (hover:none),(pointer:coarse){.btn-love .btn-underline{width:60%;left:20%}}

/* ===== 心动回忆 ===== */
#act-2{padding-top:var(--space-xl);padding-bottom:var(--space-xl)}
#act-2 .poem-line{
  grid-column:3/7;margin-left:8vw;overflow:hidden;
  font-family:"Playfair Display","Noto Serif SC",serif;
  font-size:clamp(22px,4.5vw,48px);font-weight:700;color:var(--wine);
}
#act-2 .poem-line:nth-child(2){margin-left:16vw}
#act-2 .poem-line:nth-child(3){margin-left:4vw}
#act-2 .poem-line span{
  display:inline-block;transform:translateY(110%) rotate(2deg);
  transition:transform 1.1s var(--ease-soft);
}
#act-2 .poem-line.revealed span{transform:translateY(0) rotate(0)}
#act-2 .poem-line:nth-child(1) span{transition-delay:0.1s}
#act-2 .poem-line:nth-child(2) span{transition-delay:0.35s}
#act-2 .poem-line:nth-child(3) span{transition-delay:0.6s}

/* ===== 画心互动 ===== */
#act-3{padding-top:var(--space-lg)}
#act-3 .hint{
  font-family:"Ma Shan Zheng","Zhi Mang Xing",cursive;
  font-size:clamp(20px,4vw,36px);color:var(--rose);
  margin-bottom:1.5rem;opacity:0;transition:opacity 0.8s var(--ease-soft);
}
#act-3 .hint.show{opacity:1}
.heart-canvas-wrap{
  position:relative;width:min(420px,85vw);height:min(420px,85vw);
  border-radius:50%;overflow:hidden;margin:0 auto;touch-action:none;
}
#heartCanvas{display:block;width:100%;height:100%;touch-action:none}
.heart-success{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity 0.6s;
}
.heart-success.show{opacity:1}
.heart-success .beat-heart{font-size:clamp(60px,15vw,100px);animation:beat 0.6s var(--ease-bounce)}
.heart-success .baby-text{
  font-family:"Ma Shan Zheng","Zhi Mang Xing",cursive;
  font-size:clamp(36px,8vw,72px);color:var(--rose);
  margin-top:1rem;text-shadow:0 2px 20px rgba(184,92,110,0.3);
}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* 金色线到礼物 */
#goldLineToGift{width:2px;height:0;background:linear-gradient(to bottom,var(--gold),var(--gold-deep));transition:height 1.5s var(--ease-soft);margin:0 auto}
#goldLineToGift.show{height:30vh}

/* ===== 爱心型3D礼物盒 ===== */
#act-4{padding-top:var(--space-lg);padding-bottom:var(--space-sm)}
.gift-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;width:100%}
.gift-box-wrap{perspective:1000px;opacity:0;transform:translateY(30px);transition:all 1s var(--ease-soft)}
.gift-box-wrap.show{opacity:1;transform:translateY(0)}

/* 爱心盒整体 */
.heart-box{position:relative;width:clamp(160px,30vw,220px);height:clamp(140px,26vw,190px);cursor:pointer;touch-action:manipulation;animation:floatHeart 3.5s ease-in-out infinite alternate}
@keyframes floatHeart{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-14px) rotate(2deg)}}
.heart-box.opened{animation:none}

/* 爱心形状用clip-path */
.heart-shape{position:absolute;inset:0;clip-path:path('M50,100 C50,100 0,70 0,40 C0,15 20,0 50,25 C80,0 100,15 100,40 C100,70 50,100 50,100 Z')}

/* 盒身(下半部分) */
.heart-bottom{bottom:0;height:70%;border-radius:0 0 20px 20px;
  background:linear-gradient(160deg,#e8a0a8 0%,#d4788a 40%,#b85c6e 100%);
  box-shadow:inset 0 -10px 30px rgba(0,0,0,0.15),0 8px 30px rgba(184,92,110,0.35);
  transform-origin:top center;transition:transform 0.8s var(--ease-bounce)}
.heart-box.opened .heart-bottom{transform:rotateX(-20deg) scale(0.95)}

/* 盒盖(上半部分) */
.heart-top{top:0;height:55%;border-radius:20px 20px 0 0;z-index:3;
  background:linear-gradient(180deg,#f0b8c0 0%,#e8a0a8 60%,#d4788a 100%);
  box-shadow:inset 0 10px 25px rgba(255,255,255,0.3),0 -3px 15px rgba(184,92,110,0.2);
  transform-origin:bottom center;transition:transform 1s var(--ease-bounce)}
.heart-box.opened .heart-top{transform:rotateX(-100deg) translateY(-10px) translateZ(20px)}

/* 3D厚度层 */
.heart-depth{position:absolute;inset:4px;clip-path:path('M50,100 C50,100 0,70 0,40 C0,15 20,0 50,25 C80,0 100,15 100,40 C100,70 50,100 50,100 Z');
  background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent 50%,rgba(0,0,0,0.1));
  pointer-events:none}

/* 丝带(横向) */
.ribbon-h{position:absolute;top:58%;left:0;width:100%;height:16px;z-index:4;
  background:linear-gradient(90deg,#d7b98e,#e8c9a0,#d7b98e);
  box-shadow:0 2px 8px rgba(215,185,142,0.5)}

/* 丝带(纵向) */
.ribbon-v{position:absolute;top:0;left:45%;width:16px;height:100%;z-index:4;
  background:linear-gradient(180deg,#d7b98e,#e8c9a0,#d7b98e);
  box-shadow:2px 0 8px rgba(215,185,142,0.5)}

/* 蝴蝶结 */
.bow-center{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle,#e8c9a0,#c9a26b);z-index:5;box-shadow:0 3px 10px rgba(0,0,0,0.2)}
.bow-wing{position:absolute;top:52%;width:30px;height:22px;z-index:5;
  background:radial-gradient(ellipse at 30% 50%,#e8c9a0,#c9a26b);filter:drop-shadow(0 2px 4px rgba(0,0,0,0.15))}
.bow-wing.left{left:calc(50% - 36px);transform:translateY(-50%) rotate(-15deg);border-radius:60% 20% 60% 20%}
.bow-wing.right{left:calc(50% + 6px);transform:translateY(-50%) rotate(15deg);border-radius:20% 60% 20% 60%}

/* 盒子阴影 */
.heart-shadow{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);width:60%;height:18px;
  background:radial-gradient(ellipse,rgba(111,46,58,0.3),transparent 70%);border-radius:50%;filter:blur(6px);
  animation:shadowPulse 3.5s ease-in-out infinite alternate}
@keyframes shadowPulse{from{transform:translateX(-50%) scale(1);opacity:0.6}to{transform:translateX(-50%) scale(0.75);opacity:0.3}}

/* hover */
.heart-box:hover .heart-top{transform:rotateX(-12deg)}
.heart-box.opened:hover .heart-top{transform:rotateX(-100deg) translateY(-10px) translateZ(20px)}

/* 表单 */
.address-form{
  width:min(400px,90vw);display:flex;flex-direction:column;align-items:center;
  opacity:0;transform:translateY(30px);pointer-events:none;
  transition:all 0.8s var(--ease-soft);
}
.address-form.show{opacity:1;transform:translateY(0);pointer-events:auto}
.address-form .form-msg{
  font-family:"Ma Shan Zheng","Zhi Mang Xing",cursive;
  font-size:clamp(22px,5vw,36px);color:var(--rose);margin-bottom:2rem;
}
.input-wrap{width:100%;margin-bottom:2rem;position:relative}
.input-wrap input{
  width:100%;padding:1rem 0.5rem;border:none;border-bottom:2px solid var(--pink-2);
  background:transparent;font-family:"Noto Serif SC",serif;
  font-size:16px!important;color:var(--wine);outline:none;transition:border-color 0.4s;
}
.input-wrap input::placeholder{color:var(--pink-3);opacity:0.7}
.input-wrap input:focus{border-bottom-color:var(--gold)}
.input-underline{position:absolute;bottom:0;left:50%;width:0;height:2px;background:var(--gold);transition:width 0.5s var(--ease-soft),left 0.5s var(--ease-soft)}
.input-wrap input:focus ~ .input-underline{width:100%;left:0}
.error-msg{font-size:14px;color:var(--rose);margin-top:0.5rem;opacity:0;transition:opacity 0.3s;min-height:1.2em}
.error-msg.show{opacity:1}

.submit-btn{
  position:relative;padding:0.9rem 3rem;border:none;background:transparent;
  font-family:"Noto Serif SC",serif;font-size:clamp(16px,2.5vw,20px);
  color:var(--wine);cursor:pointer;letter-spacing:0.1em;
  overflow:hidden;min-width:160px;min-height:50px;touch-action:manipulation;
}
.submit-btn::after{
  content:'';position:absolute;bottom:8px;left:50%;width:0;height:2px;
  background:var(--gold);transition:width 0.5s var(--ease-soft),left 0.5s var(--ease-soft);
}
.submit-btn:hover::after,.submit-btn:active::after,.submit-btn:focus::after{width:70%;left:15%}
.submit-btn:active{transform:scale(0.96)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}

/* 成功消息 */
.sent-msg{
  font-family:"Ma Shan Zheng","Zhi Mang Xing",cursive;
  font-size:clamp(22px,5vw,40px);color:var(--rose);
  opacity:0;transform:translateY(20px);transition:all 0.8s var(--ease-soft);
  pointer-events:none;text-align:center;
}
.sent-msg.show{opacity:1;transform:translateY(0);pointer-events:auto}
.sent-line{display:block;margin-bottom:1rem}
.sent-addr-wrap{display:block;font-size:clamp(14px,3vw,20px);color:var(--wine);margin-bottom:1.5rem;font-family:"Noto Serif SC",serif}
.modify-btn{
  font-family:"Noto Serif SC",serif;font-size:14px;color:var(--rose);
  background:none;border:1px solid var(--pink-2);border-radius:20px;
  padding:0.4rem 1.2rem;cursor:pointer;transition:all 0.3s;
}
.modify-btn:hover,.modify-btn:active{background:var(--pink-1)}

/* ===== 响应式 ===== */
@media (max-width:768px){
  .scene{padding:8vh 6vw}
  .cover-wrap{padding:0 6vw}
  .cover-title{grid-column:1/9;font-size:clamp(44px,14vw,80px)}
  .cover-sub{grid-column:4/9;justify-self:end;margin-top:2vh}
  .cover-btn-wrap{grid-column:1/6;margin-top:4vh}
  #poemBtnWrap{grid-column:2/8}
  #act-2 .poem-line{grid-column:2/8;margin-left:0}
  #act-2 .poem-line:nth-child(2){margin-left:4vw}
  #act-2 .poem-line:nth-child(3){margin-left:0}
  .halo-1{width:80vw;height:80vw}
  .halo-2{width:60vw;height:60vw}
  .organic-blob{opacity:0.15}
  .heart-canvas-wrap{width:min(320px,85vw);height:min(320px,85vw)}
}
@media (max-width:360px){
  .cover-title{font-size:40px}
}
</style>
</head>
<body>

<!-- 背景音乐(隐藏) -->
<audio id="bgm" loop src="bgm.mp3" preload="auto"></audio>

<!-- 自定义光标 -->
<div class="cursor" id="cursor"></div>

<!-- 噪点层 -->
<svg class="grain" width="100%" height="100%" aria-hidden="true">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>

<!-- SVG 流体滤镜 -->
<svg width="0" height="0" aria-hidden="true">
  <filter id="liquid">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.015" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="42" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- 流体形状 -->
<div class="organic-blob organic-blob-1"></div>
<div class="organic-blob organic-blob-2"></div>

<!-- 光晕 -->
<div class="halo halo-1"></div>
<div class="halo halo-2"></div>

<!-- 花瓣粒子 Canvas -->
<canvas id="petalCanvas"></canvas>

<!-- 金色线 -->
<div id="goldLineToGift"></div>

<!-- ===== 加载幕 ===== -->
<div id="loading">
  <p id="loadingText">正在收集鹊桥星尘……</p>
  <div class="progress-line"><div class="progress-fill" id="progressFill"></div>
</div></div>

<!-- ===== 场景容器 ===== -->
<!-- 第一幕:封面 -->
<section class="scene active" id="act-1">
  <div class="cover-wrap">
    <h1 class="cover-title">七夕<br>只为你</h1>
    <p class="cover-sub">有些话,<br>想在这个夜晚说给你听</p>
    <div class="cover-btn-wrap">
      <button class="btn-love" id="openBtn">轻轻打开<span aria-hidden="true">→</span><span class="btn-underline"></span></button>
    </div>
  </div>
</section>

<!-- 第二幕:心动回忆 -->
<section class="scene" id="act-2">
  <div class="poem-line"><span>初见那天,风很轻</span></div>
  <div class="poem-line"><span>后来所有黄昏都像你</span></div>
  <div class="poem-line"><span>想和你一起浪费余生</span></div>
  <div class="poem-btn-wrap" id="poemBtnWrap" style="grid-column:3/7;margin-top:var(--space-md);opacity:0;pointer-events:none;transition:opacity 0.8s var(--ease-soft)">
    <button class="btn-love" id="continueToDraw">继续<span aria-hidden="true">→</span><span class="btn-underline"></span></button>
  </div>
</section>

<!-- 第三幕:画心互动 -->
<section class="scene" id="act-3">
  <p class="hint" id="heartHint">用手指画颗心给我看看 ♡</p>
  <div class="heart-canvas-wrap">
    <canvas id="heartCanvas"></canvas>
    <div class="heart-success" id="heartSuccess">
      <div class="beat-heart">❤️</div>
      <div class="baby-text">宝宝</div>
    </div>
  </div>
</section>

<!-- 第四幕:礼物与地址 -->
<section class="scene" id="act-4">
  <div class="gift-stage">
    <div class="gift-box-wrap" id="giftBoxWrap">
      <div class="heart-box" id="giftBox" role="button" tabindex="0" aria-label="点击打开礼物">
        <div class="heart-shape heart-bottom"></div>
        <div class="heart-shape heart-top"></div>
        <div class="heart-depth"></div>
        <div class="ribbon-h"></div>
        <div class="ribbon-v"></div>
        <div class="bow-wing left"></div>
        <div class="bow-wing right"></div>
        <div class="bow-center"></div>
        <div class="heart-shadow"></div>
      </div>
    </div>
    <form class="address-form" id="giftForm" novalidate>
      <p class="form-msg">宝宝我要送你一个礼物</p>
      <div class="input-wrap">
        <input id="address" name="address" type="text" placeholder="告诉我你的地址" required minlength="3" autocomplete="off">
        <div class="input-underline"></div>
        <div class="error-msg" id="errorMsg"></div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">锁定向你</button>
    </form>
    <p class="sent-msg" id="sentMsg">
      <span class="sent-line">礼物已经在路上了 ❤️</span>
      <span class="sent-addr-wrap">寄到:<span id="confirmAddr"></span></span>
      <button class="modify-btn" id="modifyAddrBtn" type="button">修改地址</button>
    </p>
  </div>
</section>

<script>
/* ============================================================
   七夕 · 只为你  —  纯前端单页(场景锁定版)
   数据收集: Formspree(主) + Telegram Bot(备) + localStorage(兜底)
   ============================================================ */

// ── 配置(替换为你的) ──
const FORM_ENDPOINT = 'https://formspree.io/f/YOUR_FORM_ID';
const TELEGRAM_TOKEN = '';
const TELEGRAM_CHAT_ID = '';

// ── 设备三档检测 ──
function getDevice(){
  const w=innerWidth;
  const touch=matchMedia('(pointer:coarse)').matches;
  if(w<768||(touch&&w<1024))return 'mobile';
  if(w<1280&&touch)return 'tablet';
  return 'desktop';
}
const DEVICE=getDevice();
const isMobile=DEVICE==='mobile';
const isTablet=DEVICE==='tablet';

// ── 工具函数 ──
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const lerp=(a,b,t)=>a+(b-a)*t;

// ═══════════════════════════════════════════════════════════
//  背景音乐(全局,场景切换不影响)
// ═══════════════════════════════════════════════════════════
const bgm=$('#bgm');
let bgmInitialized=false;
function fadeInBgm(){
  let vol=0;
  const fadeInterval=setInterval(()=>{
    vol+=0.02;
    if(vol>=0.2){vol=0.2;clearInterval(fadeInterval)}
    bgm.volume=vol;
  },100);
}
function initBgm(){
  if(bgmInitialized)return;
  bgm.volume=0;
  bgm.play().then(()=>{fadeInBgm();bgmInitialized=true}).catch(()=>{
    const start=()=>{bgm.play().then(()=>{fadeInBgm();bgmInitialized=true}).catch(()=>{})};
    window.addEventListener('click',start,{once:true});
    window.addEventListener('touchstart',start,{once:true});
  });
}
initBgm();

// ═══════════════════════════════════════════════════════════
//  自定义光标
// ═══════════════════════════════════════════════════════════
const cursor=$('#cursor');
let cursorX=0,cursorY=0,realX=0,realY=0;
if(cursor){
  addEventListener('mousemove',e=>{cursorX=e.clientX;cursorY=e.clientY});
  addEventListener('click',()=>{cursor.classList.add('click');setTimeout(()=>cursor.classList.remove('click'),300)});
  (function animCursor(){
    realX=lerp(realX,cursorX,0.12);realY=lerp(realY,cursorY,0.12);
    cursor.style.transform=`translate(${realX}px,${realY}px) translate(-50%,-50%)`;
    requestAnimationFrame(animCursor);
  })();
}

// ═══════════════════════════════════════════════════════════
//  花瓣粒子系统
// ═══════════════════════════════════════════════════════════
const pCanvas=$('#petalCanvas'),pCtx=pCanvas.getContext('2d');
let pw,ph,petals=[],mouseX=-9999,mouseY=-9999;
const COLORS=['#F3C6CD','#E39AA6','#B85C6E','#D7B98E','#F8DDE2'];

function resizePetal(){pw=pCanvas.width=innerWidth;ph=pCanvas.height=innerHeight}
addEventListener('resize',resizePetal);resizePetal();
addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});
addEventListener('mouseout',()=>{mouseX=-9999;mouseY=-9999});

class Petal{
  constructor(){this.reset();this.y=Math.random()*ph}
  reset(){
    this.x=Math.random()*pw;this.y=-30;this.size=8+Math.random()*16;
    this.alpha=0.4+Math.random()*0.5;this.color=COLORS[Math.floor(Math.random()*COLORS.length)];
    this.vx=-0.5+Math.random();this.vy=0.5+Math.random()*1.2;
    this.rot=Math.random()*Math.PI*2;this.vr=-0.02+Math.random()*0.04;
    this.sway=Math.random()*0.02;this.phase=Math.random()*Math.PI*2;
  }
  update(){
    const dx=this.x-mouseX,dy=this.y-mouseY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<120){const f=(120-dist)/120*0.6;this.x+=dx/dist*f;this.y+=dy/dist*f}
    this.x+=this.vx+Math.sin(this.y*this.sway+this.phase)*0.3;
    this.y+=this.vy;this.rot+=this.vr;
    if(this.y>ph+40)this.reset();if(this.x<-40)this.x=pw+40;if(this.x>pw+40)this.x=-40;
  }
  draw(){
    pCtx.save();pCtx.translate(this.x,this.y);pCtx.rotate(this.rot);
    pCtx.scale(this.size/14,this.size/14);pCtx.globalAlpha=this.alpha;pCtx.fillStyle=this.color;
    pCtx.beginPath();pCtx.moveTo(0,0);
    pCtx.bezierCurveTo(5,-6,10,-3,14,0);pCtx.bezierCurveTo(10,3,5,6,0,0);
    pCtx.fill();pCtx.restore();
  }
}
const petalCount=isMobile?30:(isTablet?50:70);
for(let i=0;i<petalCount;i++)petals.push(new Petal());
function tickPetals(){
  pCtx.clearRect(0,0,pw,ph);
  petals.forEach(p=>{p.update();p.draw()});
  requestAnimationFrame(tickPetals);
}
tickPetals();
function setPetalSpeed(m){petals.forEach(p=>{p.vy=(0.5+Math.random()*1.2)*m})}

// ═══════════════════════════════════════════════════════════
//  场景锁定状态机
// ═══════════════════════════════════════════════════════════
const scenes=$$('.scene');
let currentScene=0;
function showScene(idx){
  scenes.forEach((s,i)=>s.classList.toggle('active',i===idx));
  currentScene=idx;
  if(idx===1)setTimeout(startPoemReveal,400);
  if(idx===2)setTimeout(()=>$('#heartHint').classList.add('show'),600);
  if(idx===3)setTimeout(()=>$('#giftBoxWrap').classList.add('show'),400);
}

// ═══════════════════════════════════════════════════════════
//  加载幕
// ═══════════════════════════════════════════════════════════
const loading=$('#loading'),progressFill=$('#progressFill');
let progress=0;
const loadingMsgs=['正在收集鹊桥星尘……','银河已经搭好了','只差最后一点点……'];
const loadingText=$('#loadingText');
const loadTimer=setInterval(()=>{
  progress+=Math.random()*15+5;
  if(progress>=100){progress=100;clearInterval(loadTimer);finishLoading()}
  progressFill.style.width=progress+'%';
  loadingText.textContent=loadingMsgs[Math.min(Math.floor(progress/35),2)];
},200);
function finishLoading(){
  setTimeout(()=>{
    loading.classList.add('hide');
    setTimeout(()=>{loading.style.display='none'},800);
  },400);
}

// ═══════════════════════════════════════════════════════════
//  封面→回忆
// ═══════════════════════════════════════════════════════════
$('#openBtn').addEventListener('click',()=>{
  setPetalSpeed(0.4);showScene(1);initBgm();
});
function startPoemReveal(){
  const lines=$$('#act-2 .poem-line');
  lines.forEach((line,i)=>{
    setTimeout(()=>line.classList.add('revealed'),i*900);
  });
  // 诗全部浮现后才显示继续按钮
  setTimeout(()=>{
    document.getElementById('poemBtnWrap').classList.add('show');
  },3200);
}

// 回忆→画心
$('#continueToDraw').addEventListener('click',()=>{
  showScene(2);initBgm();
});

// ═══════════════════════════════════════════════════════════
//  画心互动
// ═══════════════════════════════════════════════════════════
const hCanvas=$('#heartCanvas'),hCtx=hCanvas.getContext('2d');
const heartSuccess=$('#heartSuccess');
let hW,hH,drawing=false,paths=[],heartFormed=false;

function resizeHeart(){
  const wrap=hCanvas.parentElement;
  const screenW=innerWidth,screenH=innerHeight;
  const availW=screenW-40,maxH=screenH*0.6;
  let size=Math.min(availW,maxH);
  size=Math.floor(size);if(size<200)size=200;
  hW=hCanvas.width=size;hH=hCanvas.height=size;
  redrawPaths();
}
addEventListener('resize',resizeHeart);
setTimeout(resizeHeart,100);

function redrawPaths(){
  hCtx.clearRect(0,0,hW,hH);
  if(paths.length<2)return;
  hCtx.beginPath();hCtx.moveTo(paths[0].x,paths[0].y);
  paths.forEach(p=>hCtx.lineTo(p.x,p.y));
  hCtx.strokeStyle='rgba(184,92,110,0.6)';hCtx.lineWidth=3;
  hCtx.lineCap='round';hCtx.lineJoin='round';hCtx.stroke();
}

function isHeartShape(pts){
  if(pts.length<30)return false;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const w=maxX-minX,h=maxY-minY;
  if(w<40||h<40)return false;
  const ratio=w/h;if(ratio<0.6||ratio>1.6)return false;
  const cy=(minY+maxY)/2;
  const upper=pts.filter(p=>p.y<cy).length;
  const lower=pts.filter(p=>p.y>=cy).length;
  if(upper<lower*0.5)return false;
  return true;
}

function getPos(e){
  const rect=hCanvas.getBoundingClientRect();
  return{x:e.clientX-rect.left,y:e.clientY-rect.top};
}

hCanvas.addEventListener('pointerdown',e=>{
  if(heartFormed)return;drawing=true;paths=[];
  const pos=getPos(e);paths.push(pos);
  hCtx.beginPath();hCtx.moveTo(pos.x,pos.y);
  hCtx.strokeStyle='rgba(184,92,110,0.7)';hCtx.lineWidth=3;
  hCtx.lineCap='round';hCtx.lineJoin='round';
});
hCanvas.addEventListener('pointermove',e=>{
  if(!drawing||heartFormed)return;
  const pos=getPos(e);paths.push(pos);
  hCtx.lineTo(pos.x,pos.y);hCtx.stroke();
  if(paths.length>=80||(paths.length%10===0&&isHeartShape(paths)))formHeart();
});
hCanvas.addEventListener('pointerup',()=>{
  if(!drawing||heartFormed)return;drawing=false;
  if(isHeartShape(paths))formHeart();
});
hCanvas.addEventListener('pointerleave',()=>{drawing=false});

function formHeart(){
  heartFormed=true;drawing=false;
  const cx=paths.reduce((s,p)=>s+p.x,0)/paths.length;
  const cy=paths.reduce((s,p)=>s+p.y,0)/paths.length;
  spawnParticles(cx,cy);
  setTimeout(()=>{
    heartSuccess.classList.add('show');
    // 1秒后金色线,再1.5秒后跳转礼物
    setTimeout(()=>{
      $('#goldLineToGift').classList.add('show');
      setTimeout(()=>{
        $('#goldLineToGift').classList.remove('show');
        showScene(3);
      },1500);
    },1000);
  },300);
}

// 粒子爆发
let burstParticles=[],bursting=false;
class Particle{
  constructor(x,y,vx,vy,color){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;
    this.alpha=1;this.size=2+Math.random()*4;this.life=1;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vx*=0.96;this.vy*=0.96;this.vy+=0.05;this.life-=0.015;this.alpha=this.life}
  draw(){
    if(this.life<=0)return;
    hCtx.save();hCtx.globalAlpha=this.alpha;hCtx.fillStyle=this.color;
    hCtx.beginPath();hCtx.arc(this.x,this.y,Math.max(0.5,this.size*this.life),0,Math.PI*2);hCtx.fill();
    hCtx.restore();
  }
}
function spawnParticles(x,y){
  for(let i=0;i<40;i++){
    const angle=Math.random()*Math.PI*2,speed=2+Math.random()*4;
    burstParticles.push(new Particle(x,y,Math.cos(angle)*speed,Math.sin(angle)*speed,COLORS[Math.floor(Math.random()*COLORS.length)]));
  }
  if(!bursting){bursting=true;tickBurst()}
}
function tickBurst(){
  if(!bursting)return;
  burstParticles.forEach(p=>{p.update();p.draw()});
  burstParticles=burstParticles.filter(p=>p.life>0);
  if(burstParticles.length===0){bursting=false;return}
  requestAnimationFrame(tickBurst);
}

// ═══════════════════════════════════════════════════════════
//  3D礼物盒 + 地址表单
// ═══════════════════════════════════════════════════════════
const giftBox=$('#giftBox'),giftForm=$('#giftForm'),sentMsg=$('#sentMsg');
const addressInput=$('#address'),errorMsg=$('#errorMsg'),submitBtn=$('#submitBtn');

giftBox.addEventListener('click',openGift);
giftBox.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openGift()});
function openGift(){
  giftBox.classList.add('opened');
  setTimeout(()=>giftForm.classList.add('show'),600);
}

// 地址推送
async function submitAddress(address){
  let success=false;
  if(FORM_ENDPOINT&&!FORM_ENDPOINT.includes('YOUR_FORM_ID')){
    try{
      const res=await fetch(FORM_ENDPOINT,{
        method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({address})
      });
      if(res.ok)success=true;
    }catch(e){}
  }
  if(!success&&TELEGRAM_TOKEN&&TELEGRAM_CHAT_ID){
    const url=`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
    try{
      const res=await fetch(url,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:`💌 七夕礼物地址:\n${address}`})
      });
      if(res.ok)success=true;
    }catch(e){}
  }
  if(!success)localStorage.setItem('qixi_address',address);
  return success;
}

// 表单提交
giftForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const address=addressInput.value.trim();
  if(address.length<3){showError('地址至少写3个字哦');return}
  if(!/[\u4e00-\u9fff]/.test(address)){showError('地址要包含中文');return}
  errorMsg.classList.remove('show');
  submitBtn.disabled=true;submitBtn.textContent='正在锁定...';

  localStorage.setItem('qixi_address',address);
  localStorage.setItem('qixi_time',new Date().toLocaleString('zh-CN'));
  await submitAddress(address);

  giftForm.classList.remove('show');
  setTimeout(()=>{
    $('#confirmAddr').textContent=address;
    sentMsg.classList.add('show');
  },400);
});

function showError(msg){errorMsg.textContent=msg;errorMsg.classList.add('show')}
addressInput.addEventListener('input',()=>{if(addressInput.value.trim().length>=3)errorMsg.classList.remove('show')});

// 修改地址
$('#modifyAddrBtn').addEventListener('click',()=>{
  sentMsg.classList.remove('show');
  giftForm.classList.add('show');
  submitBtn.disabled=false;submitBtn.textContent='锁定向你';
  addressInput.focus();
});
</script>
</body>
</html>
