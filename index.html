<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>七夕 · 只为你</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;700&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF1EF;--pink-1:#F8DDE2;--pink-2:#F3C6CD;--pink-3:#E39AA6;
  --rose:#B85C6E;--wine:#6F2E3A;--gold:#D7B98E;--gold-deep:#C9A26B;
  --ease-soft:cubic-bezier(0.16,1,0.3,1);
  --ease-bounce:cubic-bezier(0.34,1.56,0.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:"Cormorant Garamond","Noto Serif SC",serif;background:var(--bg);color:var(--wine);line-height:1.8;-webkit-font-smoothing:antialiased}
@supports (hover:hover) and (pointer:fine){body{cursor:none}}
::selection{background:var(--pink-2);color:var(--wine)}

/* 噪点 */
.grain{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.04;mix-blend-mode:overlay}

/* 光标 */
.cursor{position:fixed;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,rgba(215,185,142,0.7),transparent 70%);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform 0.15s var(--ease-soft),opacity:0.3s;mix-blend-mode:multiply}
.cursor.click{transform:translate(-50%,-50%) scale(2.5);opacity:0.3}
@media (hover:none),(pointer:coarse){.cursor{display:none}body{cursor:auto}}

/* 花瓣粒子 */
#petalCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.halo{position:fixed;border-radius:50%;pointer-events:none;z-index:0;animation:breathe 8s ease-in-out infinite alternate}
.halo-1{width:60vw;height:60vw;top:-10%;right:-15%;background:radial-gradient(circle,rgba(248,221,226,0.5),transparent 65%)}
.halo-2{width:45vw;height:45vw;bottom:-10%;left:-10%;background:radial-gradient(circle,rgba(243,198,205,0.4),transparent 60%);animation-delay:-4s}
@keyframes breathe{from{transform:scale(0.9);opacity:0.4}to{transform:scale(1.2);opacity:0.8}}
.organic-blob{position:fixed;filter:url(#liquid);z-index:0;pointer-events:none;animation:flow 16s ease-in-out infinite alternate}
.organic-blob-1{width:38vw;height:38vw;top:25vh;right:-5vw;background:var(--pink-2);opacity:0.3}
.organic-blob-2{width:28vw;height:28vw;bottom:15vh;left:-8vw;background:var(--pink-1);opacity:0.25;animation-delay:-8s;animation-duration:20s}
@keyframes flow{from{transform:translateX(-3%) rotate(-2deg)}to{transform:translateX(3%) rotate(2deg)}}

/* ============ 核心:每幕固定视口高度 ============ */
.scene{
  position:fixed;inset:0;
  display:none;
  flex-direction:column;justify-content:center;align-items:center;
  width:100%;height:100dvh;
  overflow:hidden;
  padding:4vmin 6vmin;
}
.scene.active{display:flex}

/* 加载 */
#loading{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity 0.8s var(--ease-soft)}
#loading.hide{opacity:0;pointer-events:none}
#loading p{font-family:"Ma Shan Zheng",cursive;font-size:clamp(18px,4vw,32px);color:var(--rose);margin-bottom:2rem}
.progress-line{width:min(280px,60vw);height:2px;background:var(--pink-1);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:2px}

/* 封面 */
#act-1{padding:0}
.cover-wrap{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:1fr auto 1fr auto 1fr;align-items:center;width:100%;height:100%;padding:0 8vmin}
.cover-title{grid-column:1/6;grid-row:2/3;font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(48px,13vw,150px);font-weight:700;letter-spacing:0.02em;color:var(--wine);line-height:1.05}
.cover-sub{grid-column:5/9;grid-row:3/4;justify-self:end;align-self:start;font-family:"Ma Shan Zheng",cursive;font-size:clamp(22px,5vw,56px);color:var(--rose);margin-top:2vh}
.cover-btn-wrap{grid-column:1/5;grid-row:4/5;margin-top:3vh}

.btn-love{position:relative;display:inline-flex;align-items:center;gap:0.75rem;padding:0.8rem 2.2rem;border:none;background:transparent;font-family:"Noto Serif SC",serif;font-size:clamp(15px,2.5vw,20px);color:var(--wine);cursor:pointer;letter-spacing:0.08em;transition:all 0.3s var(--ease-soft);touch-action:manipulation}
.btn-love .btn-underline{position:absolute;bottom:0;left:50%;width:0;height:2px;background:var(--gold);transition:width 0.6s var(--ease-soft),left 0.6s var(--ease-soft)}
.btn-love:hover .btn-underline,.btn-love:active .btn-underline,.btn-love:focus .btn-underline{width:85%;left:7.5%}
.btn-love:active{transform:scale(0.97)}
@media (hover:none),(pointer:coarse){.btn-love .btn-underline{width:60%;left:20%}}

/* 回忆 */
#act-2{flex-direction:column;justify-content:center;gap:0}
#act-2 .poem-line{grid-column:unset;font-family:"Playfair Display","Noto Serif SC",serif;font-size:clamp(20px,4.5vw,48px);font-weight:700;color:var(--wine);overflow:hidden;text-align:center;width:100%}
#act-2 .poem-line span{display:inline-block;transform:translateY(110%) rotate(2deg);transition:transform 1.1s var(--ease-soft)}
#act-2 .poem-line.revealed span{transform:translateY(0) rotate(0)}
#act-2 .poem-line:nth-child(1) span{transition-delay:0.1s}
#act-2 .poem-line:nth-child(2) span{transition-delay:0.35s}
#act-2 .poem-line:nth-child(3) span{transition-delay:0.6s}

#poemBtnWrap{margin-top:2rem;text-align:center;opacity:0;pointer-events:none;transition:opacity 0.8s var(--ease-soft)}
#poemBtnWrap.show{opacity:1;pointer-events:auto}
.continue-hint{margin-bottom:8px}
.hint-arrow{font-size:1.3rem;color:var(--gold-deep);animation:hintFloat 1.5s ease-in-out infinite}
@keyframes hintFloat{0%,100%{transform:translateY(0);opacity:0.4}50%{transform:translateY(6px);opacity:0.9}}
.hint-glow{width:36px;height:36px;margin:6px auto 0;background:radial-gradient(circle,rgba(215,185,142,0.4),transparent);border-radius:50%;animation:glowPulse 2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:0.3}50%{transform:scale(1.4);opacity:0.6}}

/* 画心 */
#scene-heart{flex-direction:column;justify-content:center;gap:0.5rem}
#scene-heart .hint{font-family:"Ma Shan Zheng",cursive;font-size:clamp(16px,3.5vw,30px);color:var(--rose);opacity:0;transition:opacity 0.8s var(--ease-soft);text-align:center}
#scene-heart .hint.show{opacity:1}
#draw-progress{font-family:"Ma Shan Zheng",cursive;font-size:clamp(13px,2.5vw,17px);color:var(--rose);background:rgba(248,221,226,0.85);padding:3px 12px;border-radius:16px;min-height:1.5em}
.draw-container{position:relative;display:flex;justify-content:center;align-items:center}
.draw-canvas-wrapper{position:relative}
#heartCanvas{position:relative;z-index:2;border-radius:50%;background:rgba(251,241,239,0.5);box-shadow:0 0 0 2px rgba(215,185,142,0.3),inset 0 0 30px rgba(248,221,226,0.8);touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#guideCanvas{position:absolute;top:0;left:0;z-index:3;pointer-events:none;border-radius:50%}
.heart-success{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 0.6s;z-index:5}
.heart-success.show{opacity:1}
.heart-success .beat-heart{font-size:clamp(50px,13vw,90px);animation:beat 0.6s var(--ease-bounce)}
.heart-success .baby-text{font-family:"Ma Shan Zheng",cursive;font-size:clamp(32px,7vw,68px);color:var(--rose);margin-top:0.5rem;text-shadow:0 2px 20px rgba(184,92,110,0.3)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

#goldLineToGift{width:2px;height:0;background:linear-gradient(to bottom,var(--gold),var(--gold-deep));transition:height 1.5s var(--ease-soft)}
#goldLineToGift.show{height:20vh}

/* ========== 精致2D礼物盒 ========== */
#act-4{flex-direction:column;justify-content:center;gap:0.5rem}
.gift-stage{display:flex;flex-direction:column;align-items:center;justify-content:center}
.gift-box-wrap{perspective:1200px;opacity:0;transform:translateY(30px);transition:all 1s var(--ease-soft)}
.gift-box-wrap.show{opacity:1;transform:translateY(0)}

.gift-premium{position:relative;width:clamp(160px,30vw,240px);height:clamp(140px,26vw,200px);cursor:pointer;animation:floatPremium 4s ease-in-out infinite;transform-origin:center bottom}
@keyframes floatPremium{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-6px) rotate(0.8deg)}65%{transform:translateY(-10px) rotate(-0.5deg)}}

.premium-shadow{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:70%;height:18px;background:radial-gradient(ellipse,rgba(111,46,58,0.3),transparent 70%);border-radius:50%;filter:blur(4px);animation:shadowFloat 4s ease-in-out infinite}
@keyframes shadowFloat{0%,100%{transform:translateX(-50%) scale(1);opacity:0.6}30%{transform:translateX(-50%) scale(0.9);opacity:0.45}}

.body-premium{position:absolute;bottom:15px;left:12%;width:76%;height:72%;background:linear-gradient(100deg,rgba(255,255,255,0.35) 0%,transparent 25%),linear-gradient(160deg,#f8dde2 0%,#f3c6cd 40%,#e39aa6 75%,#cf8290 100%);border-radius:10px 10px 14px 14px;box-shadow:inset -2px -4px 10px rgba(111,46,58,0.25),inset 2px 4px 10px rgba(255,255,255,0.6),0 8px 25px rgba(111,46,58,0.3);overflow:hidden}
.body-ribbon-v{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:clamp(18px,4vw,28px);background:linear-gradient(90deg,#c9a26b,#d7b98e 20%,#e8cfa0 35%,#d7b98e 50%,#c9a26b 65%,#a8864f 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,0.5),inset 0 -2px 4px rgba(0,0,0,0.15);z-index:2}
.body-ribbon-h{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);height:clamp(18px,4vw,28px);background:linear-gradient(180deg,#c9a26b,#d7b98e 20%,#e8cfa0 35%,#d7b98e 50%,#c9a26b 65%,#a8864f 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,0.5),inset 0 -2px 4px rgba(0,0,0,0.15);z-index:2}
.heart-badge{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:clamp(36px,8vw,52px);height:clamp(33px,7vw,48px);background:linear-gradient(145deg,#e39aa6,#b85c6e);clip-path:path('M26 47C12 37 4 29 4 17C4 9 10 3 17 3C21 3 24.5 5 26 8C27.5 5 31 3 35 3C42 3 48 9 48 17C48 29 40 37 26 47Z');display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 4px 12px rgba(111,46,58,0.4),inset 0 2px 6px rgba(255,255,255,0.4)}
.heart-badge::after{content:'♥';font-size:clamp(14px,3vw,20px);color:rgba(255,255,255,0.9);text-shadow:0 1px 2px rgba(0,0,0,0.2)}

.lid-premium{position:absolute;top:0;left:6%;width:88%;height:22%;transform-origin:bottom center;transition:transform 1s var(--ease-bounce);z-index:5}
.gift-premium.opened .lid-premium{transform:translateY(-60%) rotateX(-20deg);opacity:0.9}
.gift-premium.opened .bow-premium{transform:translateX(-50%) translateY(-60%)}
.lid-top-surface{position:absolute;top:0;left:0;right:0;height:70%;background:linear-gradient(100deg,rgba(255,255,255,0.4) 0%,transparent 30%),linear-gradient(160deg,#f8dde2 0%,#f3c6cd 40%,#e39aa6 100%);border-radius:8px 8px 4px 4px;box-shadow:inset 2px 4px 10px rgba(255,255,255,0.6),inset -2px -2px 8px rgba(111,46,58,0.2),0 4px 10px rgba(111,46,58,0.25)}
.lid-front-edge{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(180deg,#d7a0ac 0%,#c97a8a 60%,#b85c6e 100%);border-radius:0 0 6px 6px}
.lid-ribbon-v{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:clamp(18px,4vw,28px);background:linear-gradient(90deg,#c9a26b,#d7b98e 30%,#e8cfa0 50%,#d7b98e 70%,#a8864f);z-index:2}
.lid-ribbon-h{position:absolute;top:20%;left:0;right:0;height:clamp(14px,3vw,22px);background:linear-gradient(180deg,#c9a26b,#d7b98e 30%,#e8cfa0 50%,#d7b98e 70%,#a8864f);z-index:2}

.bow-premium{position:absolute;top:-15%;left:50%;transform:translateX(-50%);width:clamp(60px,15vw,100px);height:clamp(36px,9vw,60px);z-index:8;transition:transform 1s var(--ease-bounce);pointer-events:none}
.bow-wing{position:absolute;top:15%;width:clamp(28px,7vw,42px);height:clamp(20px,5vw,32px);background:radial-gradient(ellipse at 30% 30%,#f0ddb8 0%,#e8cfa0 40%,#d7b98e 70%,#c9a26b 100%);box-shadow:inset 0 -2px 6px rgba(166,134,79,0.4),inset 0 2px 4px rgba(255,255,255,0.6)}
.bow-wing-left{left:0;transform:rotate(-18deg) skewY(-4deg);border-radius:60% 40% 60% 40% / 70% 50% 50% 30%}
.bow-wing-right{right:0;transform:rotate(18deg) skewY(4deg);border-radius:40% 60% 40% 60% / 50% 70% 30% 50%}
.bow-knot{position:absolute;top:35%;left:50%;transform:translateX(-50%);width:clamp(14px,3vw,24px);height:clamp(12px,3vw,20px);background:linear-gradient(145deg,#f0ddb8 0%,#d7b98e 50%,#c9a26b 100%);border-radius:40% 40% 50% 50%;box-shadow:inset 0 1px 3px rgba(255,255,255,0.7),inset 0 -2px 4px rgba(166,134,79,0.5),0 2px 6px rgba(111,46,58,0.25);z-index:3}
.bow-tail{position:absolute;bottom:5%;width:clamp(12px,3vw,20px);height:clamp(16px,4vw,26px);background:linear-gradient(180deg,#e8cfa0 0%,#d7b98e 50%,#c9a26b 100%)}
.bow-tail-left{left:36%;transform:rotate(12deg);border-radius:30% 20% 50% 50% / 20% 30% 50% 40%}
.bow-tail-right{right:36%;transform:rotate(-12deg);border-radius:20% 30% 50% 50% / 30% 20% 40% 50%}

/* 表单 */
.address-form{width:min(360px,85vw);display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(20px);pointer-events:none;transition:all 0.8s var(--ease-soft)}
.address-form.show{opacity:1;transform:translateY(0);pointer-events:auto}
.address-form .form-msg{font-family:"Ma Shan Zheng",cursive;font-size:clamp(20px,5vw,36px);color:var(--rose);margin-bottom:1.5rem}
.input-wrap{width:100%;margin-bottom:1.5rem;position:relative}
.input-wrap input{width:100%;padding:0.8rem 0.5rem;border:none;border-bottom:2px solid var(--pink-2);background:transparent;font-family:"Noto Serif SC",serif;font-size:16px!important;color:var(--wine);outline:none;transition:border-color 0.4s}
.input-wrap input::placeholder{color:var(--pink-3);opacity:0.7}
.input-wrap input:focus{border-bottom-color:var(--gold)}
.input-underline{position:absolute;bottom:0;left:50%;width:0;height:2px;background:var(--gold);transition:width 0.5s var(--ease-soft),left 0.5s var(--ease-soft)}
.input-wrap input:focus ~ .input-underline{width:100%;left:0}
.error-msg{font-size:13px;color:var(--rose);margin-top:0.4rem;opacity:0;transition:opacity 0.3s;min-height:1.2em}
.error-msg.show{opacity:1}
.submit-btn{position:relative;padding:0.8rem 2.8rem;border:none;background:transparent;font-family:"Noto Serif SC",serif;font-size:clamp(15px,2.5vw,20px);color:var(--wine);cursor:pointer;letter-spacing:0.1em;overflow:hidden;min-width:140px;min-height:46px;touch-action:manipulation}
.submit-btn::after{content:'';position:absolute;bottom:6px;left:50%;width:0;height:2px;background:var(--gold);transition:width 0.5s var(--ease-soft),left 0.5s var(--ease-soft)}
.submit-btn:hover::after,.submit-btn:active::after,.submit-btn:focus::after{width:70%;left:15%}
.submit-btn:active{transform:scale(0.96)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}
/* 祈求消息 */
.plead-msg{
  font-family:"Ma Shan Zheng",cursive;
  font-size:clamp(18px,4vw,28px);
  color:var(--rose);
  text-align:center;
  line-height:1.6;
  opacity:0;
  transform:translateY(20px);
  transition:all 0.8s var(--ease-soft);
  pointer-events:none;
  max-width:90vw;
}
.plead-msg.show{opacity:1;transform:translateY(0);pointer-events:auto}
.plead-msg .big{font-size:clamp(22px,5vw,36px);display:block;margin-bottom:0.5rem;color:var(--wine)}
.copy-plead-btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.7rem 2rem;border:none;background:var(--rose);color:#fff;font-family:"Noto Serif SC",serif;font-size:clamp(15px,2.5vw,18px);border-radius:25px;cursor:pointer;transition:all 0.3s;letter-spacing:0.05em;margin-top:0.5rem}
.copy-plead-btn:hover,.copy-plead-btn:active{background:var(--wine);transform:scale(0.97)}
.copy-plead-btn.copied{background:#4a7c59}
.wechat-msg{display:block;font-size:clamp(14px,3vw,20px);color:var(--wine);margin:0.8rem 0;font-family:"Noto Serif SC",serif;background:rgba(255,255,255,0.6);padding:0.5rem 1rem;border-radius:8px;word-break:break-all;border:1px dashed var(--pink-3)}

@media (max-width:360px){
  .cover-title{font-size:42px}
  .cover-sub{font-size:20px}
}
</style>
</head>
<body>

<audio id="bgm" loop src="bgm.mp3" preload="auto"></audio>
<div class="cursor" id="cursor"></div>

<svg class="grain" width="100%" height="100%" aria-hidden="true">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>
<svg width="0" height="0" aria-hidden="true">
  <filter id="liquid">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.015" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="42" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="organic-blob organic-blob-1"></div>
<div class="organic-blob organic-blob-2"></div>
<div class="halo halo-1"></div>
<div class="halo halo-2"></div>
<canvas id="petalCanvas"></canvas>
<div id="goldLineToGift"></div>

<div id="loading">
  <p id="loadingText">正在收集鹊桥星尘……</p>
  <div class="progress-line"><div class="progress-fill" id="progressFill"></div></div>
</div>

<section class="scene active" id="act-1">
  <div class="cover-wrap">
    <h1 class="cover-title">七夕<br>只为你</h1>
    <p class="cover-sub">有些话,<br>想在这个夜晚说给你听</p>
    <div class="cover-btn-wrap">
      <button class="btn-love" id="openBtn">轻轻打开<span aria-hidden="true">→</span><span class="btn-underline"></span></button>
    </div>
  </div>
</section>

<section class="scene" id="act-2">
  <div class="poem-line"><span>初见那天,风很轻</span></div>
  <div class="poem-line"><span>后来所有黄昏都像你</span></div>
  <div class="poem-line"><span>想和你一起浪费余生</span></div>
  <div id="poemBtnWrap">
    <div class="continue-hint" id="continueHint">
      <div class="hint-arrow">↓</div>
      <div class="hint-glow"></div>
    </div>
    <button class="btn-love" id="continueToDraw">继续<span aria-hidden="true">→</span><span class="btn-underline"></span></button>
  </div>
</section>

<section class="scene" id="scene-heart">
  <p class="hint" id="heartHint">用手指画颗心给我看看 ♡</p>
  <div id="draw-progress">心意完成度 0%</div>
  <div class="draw-container">
    <div class="draw-canvas-wrapper">
      <canvas id="heartCanvas"></canvas>
      <canvas id="guideCanvas"></canvas>
    </div>
  </div>
  <div class="heart-success" id="heartSuccess">
    <div class="beat-heart">❤️</div>
    <div class="baby-text">宝宝</div>
  </div>
</section>

<section class="scene" id="act-4">
  <div class="gift-stage">
    <div class="gift-box-wrap" id="giftBoxWrap">
      <div class="gift-premium" id="giftBox" role="button" tabindex="0" aria-label="点击打开礼物">
        <div class="lid-premium" id="lidPremium">
          <div class="lid-top-surface"></div>
          <div class="lid-front-edge"></div>
          <div class="lid-ribbon-v"></div>
          <div class="lid-ribbon-h"></div>
        </div>
        <div class="bow-premium" id="bowPremium">
          <div class="bow-wing bow-wing-left"></div>
          <div class="bow-wing bow-wing-right"></div>
          <div class="bow-knot"></div>
          <div class="bow-tail bow-tail-left"></div>
          <div class="bow-tail bow-tail-right"></div>
        </div>
        <div class="body-premium">
          <div class="body-ribbon-v"></div>
          <div class="body-ribbon-h"></div>
          <div class="heart-badge"></div>
        </div>
        <div class="premium-shadow"></div>
      </div>
    </div>
    <div class="plead-msg show" id="pleadMsg">
      <span class="big">宝宝求求你了 🥺</span>
      这份礼物我真的准备了好久好久...<br>
      把地址发到微信对话框里好不好<br>
      <span class="wechat-msg" id="wechatMsg">宝宝求求你了,把地址发给我吧 💕</span>
    </div>
  </div>
</section>

<script>
const FORM_ENDPOINT='';
const TELEGRAM_TOKEN='';
const TELEGRAM_CHAT_ID='';
const GITHUB_TOKEN='';
const GITHUB_REPO='';
const GITHUB_BRANCH='main';

function getDevice(){const w=innerWidth;const t=matchMedia('(pointer:coarse)').matches;if(w<768||(t&&w<1024))return 'mobile';if(w<1280&&t)return 'tablet';return 'desktop'}
const DEVICE=getDevice(),isMobile=DEVICE==='mobile',isTablet=DEVICE==='tablet';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const lerp=(a,b,t)=>a+(b-a)*t;

/* 背景音乐 */
const bgm=$('#bgm');let bgmInit=false;
function fadeInBgm(){let v=0;const i=setInterval(()=>{v+=0.02;if(v>=0.2){v=0.2;clearInterval(i)}bgm.volume=v},100)}
function initBgm(){if(bgmInit)return;bgm.volume=0;bgm.play().then(()=>{fadeInBgm();bgmInit=true}).catch(()=>{const s=()=>{bgm.play().then(()=>{fadeInBgm();bgmInit=true}).catch(()=>{})};addEventListener('click',s,{once:true});addEventListener('touchstart',s,{once:true})})}
initBgm();

/* 光标 */
const cursor=$('#cursor');let cx=0,cy=0,rx=0,ry=0;
if(cursor){addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY});addEventListener('click',()=>{cursor.classList.add('click');setTimeout(()=>cursor.classList.remove('click'),300)});(function a(){rx=lerp(rx,cx,0.12);ry=lerp(ry,cy,0.12);cursor.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;requestAnimationFrame(a)})()}

/* 花瓣粒子 */
const pCanvas=$('#petalCanvas'),pCtx=pCanvas.getContext('2d');
let pw,ph,petals=[],mx=-9999,my=-9999;
const COLORS=['#F3C6CD','#E39AA6','#B85C6E','#D7B98E','#F8DDE2'];
function resizePetal(){pw=pCanvas.width=innerWidth;ph=pCanvas.height=innerHeight}
addEventListener('resize',resizePetal);resizePetal();
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
addEventListener('mouseout',()=>{mx=-9999;my=-9999});
class Petal{constructor(){this.reset();this.y=Math.random()*ph}
  reset(){this.x=Math.random()*pw;this.y=-30;this.size=8+Math.random()*16;this.alpha=0.4+Math.random()*0.5;this.color=COLORS[Math.floor(Math.random()*COLORS.length)];this.vx=-0.5+Math.random();this.vy=0.5+Math.random()*1.2;this.rot=Math.random()*Math.PI*2;this.vr=-0.02+Math.random()*0.04;this.sway=Math.random()*0.02;this.phase=Math.random()*Math.PI*2}
  update(){const dx=this.x-mx,dy=this.y-my,d=Math.sqrt(dx*dx+dy*dy);if(d<120){const f=(120-d)/120*0.6;this.x+=dx/d*f;this.y+=dy/d*f}this.x+=this.vx+Math.sin(this.y*this.sway+this.phase)*0.3;this.y+=this.vy;this.rot+=this.vr;if(this.y>ph+40)this.reset();if(this.x<-40)this.x=pw+40;if(this.x>pw+40)this.x=-40}
  draw(){pCtx.save();pCtx.translate(this.x,this.y);pCtx.rotate(this.rot);pCtx.scale(this.size/14,this.size/14);pCtx.globalAlpha=this.alpha;pCtx.fillStyle=this.color;pCtx.beginPath();pCtx.moveTo(0,0);pCtx.bezierCurveTo(5,-6,10,-3,14,0);pCtx.bezierCurveTo(10,3,5,6,0,0);pCtx.fill();pCtx.restore()}
}
const pc=isMobile?30:(isTablet?50:70);
for(let i=0;i<pc;i++)petals.push(new Petal());
function tick(){pCtx.clearRect(0,0,pw,ph);petals.forEach(p=>{p.update();p.draw()});requestAnimationFrame(tick)}
tick();
function setSpeed(m){petals.forEach(p=>{p.vy=(0.5+Math.random()*1.2)*m})}

/* 场景切换 */
const scenes=$$('.scene');
function showScene(i){scenes.forEach((s,n)=>s.classList.toggle('active',n===i));if(i===1)setTimeout(startPoem,400);if(i===2)setTimeout(()=>{$('#heartHint').classList.add('show')},600);if(i===3)setTimeout(()=>$('#giftBoxWrap').classList.add('show'),400)}

/* 加载 */
const loading=$('#loading'),progressFill=$('#progressFill');
let progress=0;const loadingText=$('#loadingText');
const lt=setInterval(()=>{progress+=Math.random()*15+5;if(progress>=100){progress=100;clearInterval(lt);finishLoading()}progressFill.style.width=progress+'%';loadingText.textContent=['正在收集鹊桥星尘……','银河已经搭好了','只差最后一点点……'][Math.min(Math.floor(progress/35),2)]},200);
function finishLoading(){setTimeout(()=>{loading.classList.add('hide');setTimeout(()=>{loading.style.display='none'},800)},400)}

$('#openBtn').addEventListener('click',()=>{setSpeed(0.4);showScene(1);initBgm()});
function startPoem(){$$('#act-2 .poem-line').forEach((l,i)=>setTimeout(()=>l.classList.add('revealed'),i*900));setTimeout(()=>{$('#poemBtnWrap').classList.add('show');$('#continueHint').style.display='none'},3200)}
$('#continueToDraw').addEventListener('click',()=>{showScene(2);initBgm()});

/* 画心 */
const hCanvas=$('#heartCanvas'),hCtx=hCanvas.getContext('2d');
const guideCanvas=$('#guideCanvas'),gCtx=guideCanvas.getContext('2d');
const heartSuccess=$('#heartSuccess');
let hW,hH,drawing=false,heartFormed=false,isUserDrawing=false,activePointerId=null;
const GRID=20;
let heartMask=[],covered=[],totalTrail=0,isDrawable=true,guideSize=0,guideOpacity=1,guideFadeStart=null,guideAnimId=null;

function isInsideHeart(x,y){const a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0}
function initHeartMask(){heartMask=[];covered=[];const step=hW/GRID;for(let i=0;i<GRID;i++){heartMask[i]=[];covered[i]=[];for(let j=0;j<GRID;j++){const cx=(j+0.5)*step,cy=(i+0.5)*step;const nx=(cx/hW-0.5)*3,ny=(cy/hH-0.5)*3;heartMask[i][j]=isInsideHeart(nx,-ny);covered[i][j]=false}}}
function updateCoverage(x,y){const step=hW/GRID;const gx=Math.floor(x/step),gy=Math.floor(y/step);if(gx>=0&&gx<GRID&&gy>=0&&gy<GRID)covered[gy][gx]=true}
function calcProgress(){let t=0,c=0;for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++){if(heartMask[i][j]){t++;if(covered[i][j])c++}}return t?c/t:0}
function updateDrawProgress(p){const el=$('#draw-progress');if(el)el.textContent=`心意完成度 ${Math.round(p*100)}%`}
function checkCompletion(){const p=calcProgress();updateDrawProgress(p);const minTrail=hW*Math.SQRT2*0.5;if(p>=0.7&&totalTrail>=minTrail)completeHeart()}
function completeHeart(){if(!isDrawable)return;isDrawable=false;for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++)if(heartMask[i][j])covered[i][j]=true;drawFullHeart();setTimeout(()=>formHeart(),600)}
function drawFullHeart(){const step=hW/GRID;hCtx.fillStyle='rgba(184,92,110,0.5)';for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++)if(heartMask[i][j])hCtx.fillRect(j*step,i*step,step,step)}
function formHeart(){heartFormed=true;drawing=false;spawnParticles(hW/2,hH/2);setTimeout(()=>{heartSuccess.classList.add('show');setTimeout(()=>{heartSuccess.classList.remove('show');$('#goldLineToGift').classList.add('show');setTimeout(()=>{$('#goldLineToGift').classList.remove('show');showScene(3)},1500)},3000)},300)}

function resizeHeart(){const sW=innerWidth,sH=innerHeight;const maxW=Math.min(sW*0.85,420);const maxH=sH*0.5;let size=Math.floor(Math.min(maxW,maxH,sW-40));if(size<180)size=180;const dpr=window.devicePixelRatio||1;hCanvas.width=size*dpr;hCanvas.height=size*dpr;hCanvas.style.width=size+'px';hCanvas.style.height=size+'px';hCtx.setTransform(dpr,0,0,dpr,0,0);document.querySelector('.draw-canvas-wrapper').style.width=size+'px';document.querySelector('.draw-canvas-wrapper').style.height=size+'px';hW=size;hH=size;initHeartMask();initGuide(size)}
addEventListener('resize',resizeHeart);addEventListener('orientationchange',()=>setTimeout(resizeHeart,300));
setTimeout(resizeHeart,100);

function heartPoint(t,scale,cx,cy){const x=16*Math.pow(Math.sin(t),3);const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);return{x:cx+x*scale/17,y:cy-y*scale/17}}
function drawGuide(p,o){gCtx.clearRect(0,0,guideSize,guideSize);if(o<=0||guideSize===0)return;const cx=guideSize/2,cy=guideSize/2,scale=guideSize*0.7;const grad=gCtx.createRadialGradient(cx,cy,0,cx,cy,scale*0.6);grad.addColorStop(0,`rgba(227,154,166,${0.08*o})`);grad.addColorStop(0.7,`rgba(243,198,205,${0.12*o})`);grad.addColorStop(1,`rgba(251,241,239,0)`);gCtx.beginPath();for(let i=0;i<=60;i++){const t=(i/60)*Math.PI*2;const pt=heartPoint(t,scale,cx,cy);i===0?gCtx.moveTo(pt.x,pt.y):gCtx.lineTo(pt.x,pt.y)}gCtx.closePath();gCtx.fillStyle=grad;gCtx.fill();gCtx.beginPath();for(let i=0;i<=60;i++){const t=(i/60)*Math.PI*2;const pt=heartPoint(t,scale,cx,cy);i===0?gCtx.moveTo(pt.x,pt.y):gCtx.lineTo(pt.x,pt.y)}gCtx.closePath();gCtx.setLineDash([6,5]);gCtx.lineWidth=2;gCtx.strokeStyle=`rgba(184,92,110,${0.5*o})`;gCtx.stroke();gCtx.setLineDash([])}
function animateGuide(ts){if(isUserDrawing){if(guideFadeStart===null)guideFadeStart=ts;const el=ts-guideFadeStart;guideOpacity=Math.max(0,1-el/400);if(guideOpacity<=0){gCtx.clearRect(0,0,guideSize,guideSize);cancelAnimationFrame(guideAnimId);return}}else{const b=(Math.sin(ts/500)+1)/2;guideOpacity=0.5+b*0.35}drawGuide(1,guideOpacity);guideAnimId=requestAnimationFrame(animateGuide)}
function initGuide(size){guideSize=size;guideCanvas.width=size;guideCanvas.height=size;guideCanvas.style.width=size+'px';guideCanvas.style.height=size+'px';guideOpacity=1;guideFadeStart=null;isUserDrawing=false;guideAnimId=requestAnimationFrame(animateGuide)}
function onStartDraw(){isUserDrawing=true;guideFadeStart=null}
function onStopDraw(){isUserDrawing=false;guideFadeStart=null}

let pathPoints=[];
function getPos(e){const r=hCanvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
hCanvas.addEventListener('pointerdown',e=>{if(heartFormed||!isDrawable)return;e.preventDefault();drawing=true;activePointerId=e.pointerId;totalTrail=0;pathPoints=[];const pos=getPos(e);pathPoints.push(pos);hCtx.beginPath();hCtx.moveTo(pos.x,pos.y);hCtx.strokeStyle='rgba(184,92,110,0.7)';hCtx.lineWidth=3;hCtx.lineCap='round';hCtx.lineJoin='round';onStartDraw();try{hCanvas.setPointerCapture(e.pointerId)}catch(err){}});
hCanvas.addEventListener('pointermove',e=>{if(!drawing||heartFormed||e.pointerId!==activePointerId)return;e.preventDefault();const pos=getPos(e);const prev=pathPoints[pathPoints.length-1];totalTrail+=Math.hypot(pos.x-prev.x,pos.y-prev.y);pathPoints.push(pos);updateCoverage(pos.x,pos.y);checkCompletion();hCtx.lineTo(pos.x,pos.y);hCtx.stroke()});
hCanvas.addEventListener('pointerup',e=>{if(e.pointerId!==activePointerId)return;e.preventDefault();drawing=false;pathPoints=[];activePointerId=null;onStopDraw();try{hCanvas.releasePointerCapture(e.pointerId)}catch(err){}});
hCanvas.addEventListener('pointercancel',e=>{if(e.pointerId!==activePointerId)return;drawing=false;pathPoints=[];activePointerId=null;onStopDraw()});
hCanvas.addEventListener('touchstart',e=>{if(heartFormed||!isDrawable)return;e.preventDefault();const t=e.touches[0];if(!t)return;drawing=true;totalTrail=0;pathPoints=[];const r=hCanvas.getBoundingClientRect();const pos={x:t.clientX-r.left,y:t.clientY-r.top};pathPoints.push(pos);hCtx.beginPath();hCtx.moveTo(pos.x,pos.y);hCtx.strokeStyle='rgba(184,92,110,0.7)';hCtx.lineWidth=3;hCtx.lineCap='round';hCtx.lineJoin='round';onStartDraw()},{passive:false});
hCanvas.addEventListener('touchmove',e=>{if(!drawing||heartFormed)return;e.preventDefault();const t=e.touches[0];if(!t)return;const r=hCanvas.getBoundingClientRect();const pos={x:t.clientX-r.left,y:t.clientY-r.top};const prev=pathPoints[pathPoints.length-1];totalTrail+=Math.hypot(pos.x-prev.x,pos.y-prev.y);pathPoints.push(pos);updateCoverage(pos.x,pos.y);checkCompletion();hCtx.lineTo(pos.x,pos.y);hCtx.stroke()},{passive:false});
hCanvas.addEventListener('touchend',e=>{e.preventDefault();drawing=false;pathPoints=[];onStopDraw()},{passive:false});
hCanvas.addEventListener('touchcancel',e=>{drawing=false;pathPoints=[];onStopDraw()},{passive:false});

let burstParticles=[],bursting=false;
class Particle{constructor(x,y,vx,vy,c){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=c;this.alpha=1;this.size=2+Math.random()*4;this.life=1}
  update(){this.x+=this.vx;this.y+=this.vy;this.vx*=0.96;this.vy*=0.96;this.vy+=0.05;this.life-=0.015;this.alpha=this.life}
  draw(){if(this.life<=0)return;hCtx.save();hCtx.globalAlpha=this.alpha;hCtx.fillStyle=this.color;hCtx.beginPath();hCtx.arc(this.x,this.y,Math.max(0.5,this.size*this.life),0,Math.PI*2);hCtx.fill();hCtx.restore()}
}
function spawnParticles(x,y){for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*4;burstParticles.push(new Particle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,COLORS[Math.floor(Math.random()*COLORS.length)]))}if(!bursting){bursting=true;tickBurst()}}
function tickBurst(){if(!bursting)return;burstParticles.forEach(p=>{p.update();p.draw()});burstParticles=burstParticles.filter(p=>p.life>0);if(burstParticles.length===0){bursting=false;return}requestAnimationFrame(tickBurst)}

const giftBox=$('#giftBox');
giftBox.addEventListener('click',openGift);
giftBox.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openGift()});
function openGift(){giftBox.classList.add('opened');setTimeout(()=>{$('#pleadMsg').classList.add('show')},600)}
</script>
</body>
</html>
